name: hamari_virasat
description: Hamari Virasat. A family's rituals, recipes and traditions, kept for the next generation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# supabase_flutter, shared_preferences and file_picker are added by the build script
# with `flutter pub add`, so no version is guessed here.
dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # analysis_options.yaml includes package:flutter_lints/flutter.yaml, so the
  # package has to be here or `flutter analyze` fails to resolve the include.
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
