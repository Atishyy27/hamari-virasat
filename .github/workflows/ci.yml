name: CI

# Two jobs, one file:
#   checks  - runs on every push to main and every PR. Static analysis, and
#             the tests when a test/ directory exists. This is what keeps main
#             from breaking.
#   release - runs only when a version tag (v*) is pushed. Builds the release
#             APK and attaches it to a GitHub Release you can download.
#
# The Android toolchain (Gradle, AGP, Kotlin) is pinned inside app/android, so
# the runner uses those versions, not whatever it ships with. The APK is signed
# with the debug key (app/android/app/build.gradle.kts), which is fine for a
# sideloaded client demo and needs no secrets. Swap in a real upload keystore
# before this ever goes to the Play Store.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  # The release job creates a Release and uploads the APK to it.
  contents: write

jobs:
  checks:
    # Not on tag pushes: a tag is a release, handled by the job below.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Test (only when a test/ directory exists)
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory yet, skipping."
          fi

  release:
    # Only when a vX.Y.Z tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8.x needs JDK 17.
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK
        # The keys are passed at build time with --dart-define (app/lib/main.dart
        # reads them via String.fromEnvironment). If the secrets are not set, both
        # are empty and the app falls back to on-device demo data, so the build
        # still succeeds.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/hamari-virasat-${{ github.ref_name }}.apk"
      - name: Publish the APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: hamari-virasat-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
